<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieScope - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #EA580C 0%, #F59E0B 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .icon svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }
        
        h1 {
            color: #1F2937;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        p {
            color: #6B7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .features {
            text-align: left;
            margin-bottom: 32px;
        }
        
        .feature {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            background: #FEF3C7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .feature-icon svg {
            width: 14px;
            height: 14px;
            stroke: #F59E0B;
            stroke-width: 2;
            fill: none;
        }
        
        .feature-text {
            color: #4B5563;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .button {
            background: linear-gradient(135deg, #EA580C 0%, #F59E0B 100%);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
        }
        
        .status {
            margin-top: 24px;
            padding: 12px;
            background: #FEF3C7;
            border-radius: 12px;
            color: #92400E;
            font-size: 14px;
            display: none;
        }
        
        .status.online {
            background: #D1FAE5;
            color: #065F46;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
        </div>
        
        <h1>You're Offline</h1>
        <p>Don't worry! CalorieScope works offline too. Your saved data is still available.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="feature-text">Your TDEE calculations are saved locally</div>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="feature-text">Progress tracking data is preserved</div>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="feature-text">Core calculator features work offline</div>
            </div>
        </div>
        
        <button class="button" onclick="tryReload()">Try Again</button>
        
        <div class="status" id="status"></div>
    </div>
    
    <script>
        function tryReload() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Checking connection...';
            statusEl.style.display = 'block';
            statusEl.className = 'status';
            
            fetch('/')
                .then(() => {
                    statusEl.textContent = 'Connected! Reloading...';
                    statusEl.className = 'status online';
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                })
                .catch(() => {
                    statusEl.textContent = 'Still offline. Please check your connection.';
                    statusEl.className = 'status';
                });
        }
        
        // Auto-check every 30 seconds
        setInterval(() => {
            fetch('/')
                .then(() => {
                    window.location.reload();
                })
                .catch(() => {});
        }, 30000);
    </script>
</body>
</html>
